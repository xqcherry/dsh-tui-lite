# Terminal surface over the bundled dsh-base. User profile patches apply last.
- id: hmr
  disabled: true
- id: system-prompt
  config:
    personaPrefix: !!js process.env.DSH_TUI_PERSONA ?? 'You are a coding agent.'
- id: plugin-package-inventory-deepseek
  config:
    enabled: false
- id: session-telemetry-otel
  config:
    mode: !!js process.env.DSH_TELEMETRY_MODE || 'DISABLED'
    shutdownTimeoutMillis: 3000
    maxRequestBytes: 4000000
    exporter:
      url: !!js process.env.DSH_TELEMETRY_OTLP_URL ?? 'https://dsh-otel-collector.deepseeksvc.com/v1/logs'
      compression: gzip
      timeoutMillis: 1000
    processor:
      scheduledDelayMillis: 10000
      maxQueueSize: 2048
      maxExportBatchSize: 2048
      exportTimeoutMillis: 1500
- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_TUI_SESSION_ROOT ?? dshHomePath('sessions')

# These are supplied in the selected official agent preset, not duplicated globally.
- id: agent-instructions
  disabled: true
- id: command-compact
  disabled: true
- id: compaction-basic
  disabled: true
- id: plan-mode
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true
- id: tool-workflow
  disabled: true

- insert:
    - id: dsh-tui-subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
    - id: dsh-tui-agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard
    - id: dsh-tui-cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'
    - id: dsh-tui-workspace
      name: '@deepseek-ai/dsh-workspace'
    - id: dsh-tui-webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: 127.0.0.1
        port: 0
    - id: dsh-tui-auth
      name: './lib/types/oauth.js'
      inject: [llm, commands]
    - id: dsh-tui
      name: './lib/types/index.js'
      inject: [workspaceRegistry, agents]
      config:
        preset: !!js process.env.DSH_TUI_PRESET ?? undefined
        cwd: !!js process.env.DSH_TUI_WORKSPACE_TARGET ?? undefined
        sessionId: !!js process.env.DSH_TUI_RESUME_SESSION ?? undefined
