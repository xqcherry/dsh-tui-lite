# Inline TUI over the host agent, tools, storage and policy services.

- id: system-prompt
  config: !!js >-
    (() => {
      const persona = process.env.DSH_TUI_PERSONA ?? 'You are a coding agent.'
      try {
        const require = process.getBuiltinModule('node:module').createRequire(ctx.baseUrl)
        const fs = process.getBuiltinModule('node:fs')
        const manifest = require.resolve('@deepseek-ai/dsh-system-prompt/package.json')
        const version = String(JSON.parse(fs.readFileSync(manifest, 'utf8')).version ?? '')
        const match = /^(\d+)\.(\d+)\.(\d+)/u.exec(version)
        const [major, minor, patch] = match === null ? [0, 0, 0] : [Number(match[1]), Number(match[2]), Number(match[3])]
        if (major > 0 || minor > 1 || (minor === 1 && patch >= 3)) return { personaPrefix: persona }
        return { persona }
      } catch {
        return { personaPrefix: persona }
      }
    })()
- id: llm-deepseek
  config:
    apiKeyEnv: 'DEEPSEEK_API_KEY'
    baseURL: !!js process.env.DEEPSEEK_BASE_URL
    thinking: enabled
    reasoningEffort: max
- id: agent-loop
  config:
    agents: []
- id: session-telemetry-otel
  config: !!js >-
    (() => {
      let url = 'https://dsh-otel-collector.deepseeksvc.com/v1/logs'
      let modern = false
      try {
        const require = process.getBuiltinModule('node:module').createRequire(ctx.baseUrl)
        const fs = process.getBuiltinModule('node:fs')
        const manifest = require.resolve('@deepseek-ai/dsh-session-telemetry-otel/package.json')
        const version = String(JSON.parse(fs.readFileSync(manifest, 'utf8')).version ?? '')
        const match = /^(\d+)\.(\d+)\./u.exec(version)
        modern = match === null || Number(match[1]) > 0 || Number(match[2]) >= 2
        if (!modern) url = 'https://harness-telemetry.deepseeksvc.com/v1/logs'
      } catch {}
      return {
        mode: process.env.DSH_TELEMETRY_MODE || 'DISABLED',
        shutdownTimeoutMillis: 3000,
        // 0.2.0's base config caps one request at 4 MB; the older plugin's
        // schema has no such key, so only a probed 0.2+ host gets it.
        ...(modern ? { maxRequestBytes: 4000000 } : {}),
        exporter: {
          url: process.env.DSH_TELEMETRY_OTLP_URL ?? url,
          compression: 'gzip',
          timeoutMillis: 1000,
        },
        processor: {
          scheduledDelayMillis: 10000,
          maxQueueSize: 2048,
          maxExportBatchSize: 2048,
          exportTimeoutMillis: 1500,
        },
      }
    })()
- id: plugin-package-inventory-deepseek
  config:
    enabled: false
- id: agent-instructions
  disabled: true
- id: command-compact
  disabled: true
- id: compaction-basic
  disabled: true
- id: plan-mode
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: command-goal
  disabled: !!js >-
    (() => {
      const require = process.getBuiltinModule('node:module').createRequire(ctx.baseUrl)
      const fs = process.getBuiltinModule('node:fs')
      const path = process.getBuiltinModule('node:path')
      try {
        require.resolve('@deepseek-ai/dsh-agent-preset-registry/package.json')
        return true
      } catch {}
      try {
        const manifest = require.resolve('@deepseek-ai/dsh-agent-presets/package.json')
        const preset = path.join(path.dirname(manifest), 'presets', 'standard', 'agent.cordis.yml')
        return fs.readFileSync(preset, 'utf8')
          .split(/\r?\n/u)
          .some(line => line.trim() === '- id: command-goal')
      } catch {
        return false
      }
    })()
- id: tool-goal
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-pwsh
